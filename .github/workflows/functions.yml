name: functions

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prompts/**'
      - 'schema/**'
      - 'Directory.*.props'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: functions-prod

jobs:
  deploy:
    # Skipped until infra is deployed and AZURE_FUNCTIONAPP_NAME is set (T3).
    if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish src/Pipeline.Functions -c Release -o publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: publish
          sku: flexconsumption
      # Smoke test removed for now: `az functionapp show` returns no defaultHostName for
      # Flex Consumption apps. Check https://<default domain>/api/health by hand after a deploy.
      # To restore: see tasks.md (T7).
