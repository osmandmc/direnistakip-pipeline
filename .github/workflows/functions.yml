name: functions

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prompts/**'
      - 'schema/**'
      - 'Directory.*.props'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: functions-prod

jobs:
  deploy:
    # Skipped until infra is deployed and AZURE_FUNCTIONAPP_NAME is set (T3).
    if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish src/Pipeline.Functions -c Release -o publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: publish
          sku: flexconsumption
      - name: Smoke test
        # The app restarts after a deploy; a cold start can take a few minutes.
        run: |
          host=$(az functionapp show -g ${{ vars.AZURE_RESOURCE_GROUP }} -n ${{ vars.AZURE_FUNCTIONAPP_NAME }} --query defaultHostName -o tsv)
          if [ -z "$host" ]; then echo "::error::Could not read the Function App host name"; exit 1; fi
          echo "Checking https://$host/api/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 15 --retry-all-errors "https://$host/api/health"
